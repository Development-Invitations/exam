<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шпаргалки</title>
    <style>
        /* ── Тёмная тема (по умолчанию) ─────────────────────────────── */
        :root {
            --bg-base:       #0f172a;
            --bg-pane:       #1e293b;
            --bg-right:      #0b0f19;
            --bg-input:      #0f172a;
            --bg-item:       #0f172a;
            --bg-item-hover: #1e293b;
            --bg-item-active:#1e3a8a;
            --border:        #334155;
            --border-focus:  #38bdf8;
            --border-input:  #475569;
            --text-primary:  #f8fafc;
            --text-secondary:#94a3b8;
            --text-muted:    #64748b;
            --text-item:     #f8fafc;
            --accent:        #38bdf8;
            --accent-bg:     #0f172a;
            --btn-default-bg:#334155;
            --btn-default-fg:#cbd5e1;
            --btn-default-hv:#475569;
            --modal-overlay: rgba(15,23,42,0.85);
            --modal-bg:      #1e293b;
            --toast-bg:      #1e293b;
            --shadow:        rgba(0,0,0,0.4);
            --card-bg:       #1e293b;
        }

        /* ── Светлая тема ────────────────────────────────────────────── */
        body.light {
            --bg-base:       #f1f5f9;
            --bg-pane:       #ffffff;
            --bg-right:      #f8fafc;
            --bg-input:      #f1f5f9;
            --bg-item:       #f8fafc;
            --bg-item-hover: #e2e8f0;
            --bg-item-active:#dbeafe;
            --border:        #e2e8f0;
            --border-focus:  #0ea5e9;
            --border-input:  #cbd5e1;
            --text-primary:  #0f172a;
            --text-secondary:#475569;
            --text-muted:    #94a3b8;
            --text-item:     #1e293b;
            --accent:        #0ea5e9;
            --accent-bg:     #e0f2fe;
            --btn-default-bg:#e2e8f0;
            --btn-default-fg:#475569;
            --btn-default-hv:#cbd5e1;
            --modal-overlay: rgba(15,23,42,0.5);
            --modal-bg:      #ffffff;
            --toast-bg:      #ffffff;
            --shadow:        rgba(0,0,0,0.12);
            --card-bg:       #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-input); }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background 0.25s, color 0.25s;
        }

        .left-pane {
            width: 42%;
            min-width: 340px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--bg-pane);
            transition: background 0.25s, border-color 0.25s;
        }

        /* Сворачиваемая «шторка» с формой добавления вопроса и кнопками ПК —
           сворачивает ТОЛЬКО этот блок, список вопросов и поиск всегда видны.
           Кнопка — обычный блочный элемент в потоке (не absolute), поэтому
           никогда не "повисает" криво, когда форма скрыта. */
        .add-form-panel { flex-shrink: 0; }
        #addFormContainer.collapsed { display: none; }

        .panel-toggle {
            width: 100%; padding: 6px;
            background: var(--btn-default-bg); color: var(--text-secondary);
            border: none; border-top: 1px solid var(--border);
            cursor: pointer; font-size: 11px; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 5px;
            transition: background 0.2s, color 0.2s;
        }
        .panel-toggle:hover { background: var(--btn-default-hv); color: var(--text-primary); }

        .db-selector-container {
            padding: 12px 15px;
            background: var(--bg-base);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: background 0.25s;
        }
        .db-header-row { display: flex; gap: 8px; align-items: center; }

        .db-select {
            flex-grow: 1;
            padding: 8px 10px;
            background: var(--bg-pane);
            border: 1px solid var(--border-input);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            cursor: pointer;
            transition: background 0.25s, color 0.25s, border-color 0.25s;
        }

        /* ── Фирменный жёлтый (цвет логотипа 1С) — не зависит от темы ── */
        :root {
            --brand-yellow:       #FFD100;
            --brand-yellow-hover: #E6BC00;
            --brand-yellow-fg:    #1a1a1a;
        }

        .btn-small, .btn-theme, .btn-add, .btn-file-action {
            background: var(--brand-yellow) !important;
            color: var(--brand-yellow-fg) !important;
            border: none;
        }
        .btn-small:hover, .btn-theme:hover, .btn-add:hover, .btn-file-action:hover {
            background: var(--brand-yellow-hover) !important;
            color: var(--brand-yellow-fg) !important;
        }

        .btn-small {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }

        /* Кнопка темы */
        .btn-theme {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            line-height: 1;
        }

        .search-container {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-pane);
            transition: background 0.25s;
        }
        .search-input, .form-input, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background 0.25s, color 0.25s;
        }
        .search-input:focus, .form-input:focus, .form-textarea:focus { border-color: var(--border-focus); }

        .search-wrap { position: relative; }
        .search-wrap .search-input { padding-right: 34px; }
        .search-clear {
            position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
            width: 22px; height: 22px; border: none; border-radius: 50%;
            background: var(--btn-default-bg); color: var(--text-secondary);
            font-size: 13px; line-height: 1; cursor: pointer;
            display: none; align-items: center; justify-content: center;
            transition: background 0.2s, color 0.2s;
        }
        .search-clear:hover { background: var(--btn-default-hv); color: var(--text-primary); }
        .search-clear.show { display: flex; }

        /* На десктопе обёртка ничего не меняет в раскладке — только на мобильных
           превращается в единую скроллящуюся область (см. медиа-запрос ниже) */
        .left-scroll { display: contents; }

        .questions-list { overflow-y: auto; flex-grow: 1; min-height: 0; padding: 15px; }
        .question-item {
            display: none;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: var(--bg-item);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .question-item:hover { border-color: var(--border-focus); background: var(--bg-item-hover); }
        .question-item.active { border-color: var(--border-focus); background: var(--bg-item-active); }
        .q-title { font-weight: 600; font-size: 14px; color: var(--text-item); word-break: break-word; }

        .add-form-container {
            padding: 15px;
            border-top: 1px solid var(--border);
            background: var(--bg-pane);
            transition: background 0.25s;
        }
        .form-group { margin-bottom: 8px; }
        .form-textarea { resize: vertical; height: 50px; }
        .btn-add {
            width: 100%; padding: 10px;
            border-radius: 6px;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
        }

        .db-file-actions { display: flex; gap: 6px; margin-top: 8px; }
        .btn-file-action {
            flex: 1; padding: 8px 6px;
            border-radius: 6px;
            font-size: 12px; font-weight: 600;
            cursor: pointer; transition: background 0.2s; text-align: center;
        }

        .right-pane {
            width: 58%; padding: 30px; overflow-y: auto;
            background: var(--bg-right);
            transition: background 0.25s;
        }
        .current-db-title {
            font-size: 13px; color: var(--text-muted);
            margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .category-badge {
            display: inline-block; margin-left: 6px; padding: 2px 8px;
            border-radius: 4px; font-size: 11px; font-weight: 700;
            text-transform: none; letter-spacing: normal;
            background: var(--brand-yellow); color: var(--brand-yellow-fg);
        }
        .empty-placeholder { color: var(--text-muted); text-align: center; margin-top: 50px; font-size: 15px; }

        .answer-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px; padding: 20px; margin-bottom: 20px; position: relative;
            transition: background 0.25s, border-color 0.25s;
            box-shadow: 0 1px 4px var(--shadow);
        }
        .answer-card.highlight {
            border-color: var(--brand-yellow);
            border-width: 2px;
            box-shadow: 0 0 0 3px rgba(255, 209, 0, 0.35), 0 0 20px rgba(255, 209, 0, 0.45);
            background: color-mix(in srgb, var(--brand-yellow) 10%, var(--card-bg));
        }
        .answer-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-right: 70px; }
        .answer-number {
            font-size: 12px; font-weight: 600; color: var(--accent);
            background: var(--accent-bg); padding: 3px 8px;
            border-radius: 4px; border: 1px solid var(--border);
        }
        .answer-title { font-size: 18px; font-weight: bold; color: var(--text-primary); margin-bottom: 10px; word-break: break-word; }
        .answer-text { color: var(--text-secondary); line-height: 1.5; font-size: 15px; word-break: break-word; white-space: pre-wrap; }
        .btn-delete {
            position: absolute; top: 20px; right: 20px;
            background: transparent; border: 1px solid #ef4444; color: #ef4444;
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
            transition: all 0.2s;
        }
        .btn-delete:hover { background: #ef4444; color: #fff; }

        .gh-status { font-size: 11px; padding: 3px 8px; border-radius: 4px; margin-left: 6px; }
        .gh-status.from-git { background: #064e3b; color: #6ee7b7; }
        .gh-status.local-only { background: #1c1917; color: #a8a29e; }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--modal-overlay); backdrop-filter: blur(3px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.2s ease;
        }
        .modal-overlay.open { opacity: 1; visibility: visible; }
        .modal-box {
            background: var(--modal-bg); border: 1px solid var(--border); border-radius: 10px;
            width: 450px; max-width: 95%; padding: 24px; box-shadow: 0 15px 30px var(--shadow);
        }
        .modal-title { font-size: 18px; font-weight: 600; color: var(--text-primary); margin-bottom: 10px; }
        .modal-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.5; }
        .modal-input {
            width: 100%; padding: 10px 14px; background: var(--bg-input);
            border: 1px solid var(--border-input); border-radius: 6px;
            color: var(--text-primary); font-size: 14px; outline: none; margin-bottom: 12px;
        }
        .modal-input:focus { border-color: var(--border-focus); }
        .modal-textarea { resize: vertical; height: 100px; font-family: inherit; }
        .modal-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; display: block; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
        .modal-btn { padding: 9px 18px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; }
        .modal-btn.cancel { background: var(--btn-default-bg); color: var(--btn-default-fg); }
        .modal-btn.confirm { background: var(--brand-yellow); color: var(--brand-yellow-fg); }
        .modal-btn.confirm:hover { background: var(--brand-yellow-hover); }
        .modal-btn.danger { background: #ef4444; color: #fff; }

        /* Toast (слева, чтобы не перекрывать плавающую кнопку чата справа) */
        .toast {
            position: fixed; bottom: 24px; left: 24px;
            background: var(--toast-bg); border: 1px solid var(--border);
            border-radius: 8px; padding: 12px 18px;
            font-size: 14px; color: var(--text-primary);
            box-shadow: 0 8px 20px var(--shadow);
            transform: translateY(20px); opacity: 0;
            transition: all 0.3s ease; pointer-events: none; z-index: 99999;
            max-width: min(360px, calc(100vw - 48px));
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-color: #065f46; color: #059669; }
        .toast.error { border-color: #7f1d1d; color: #ef4444; }

        .loading-text { color: var(--text-muted); font-size: 13px; padding: 15px; text-align: center; }

        /* ── Плавающий Telegram-чат (в стиле мессенджера) ─────────────────── */
        @keyframes chatFabPulse {
            0%, 100% { box-shadow: 0 6px 18px rgba(0,0,0,0.3), 0 0 0 0 rgba(255,209,0,0.5); }
            50% { box-shadow: 0 6px 18px rgba(0,0,0,0.3), 0 0 0 8px rgba(255,209,0,0); }
        }
        .chat-fab {
            position: fixed; bottom: 24px; right: 24px;
            width: 56px; height: 56px; border-radius: 50%;
            background: var(--brand-yellow); color: var(--brand-yellow-fg);
            border: none; cursor: pointer; font-size: 26px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
            z-index: 10000; transition: transform 0.15s, background 0.2s;
        }
        .chat-fab:hover { background: var(--brand-yellow-hover); transform: scale(1.06); }
        .chat-fab.unread { animation: chatFabPulse 1.6s ease-in-out infinite; }
        .chat-fab .badge {
            position: absolute; top: -2px; right: -2px;
            min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px;
            background: #ef4444; color: #fff; font-size: 11px; font-weight: 700;
            display: none; align-items: center; justify-content: center;
            border: 2px solid var(--bg-base);
        }
        .chat-fab .badge.show { display: flex; }

        .chat-panel {
            position: fixed; bottom: 92px; right: 24px;
            width: 360px; max-width: calc(100vw - 32px);
            height: 500px; max-height: calc(100vh - 140px);
            background: var(--bg-right); border: 1px solid var(--border); border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.45);
            display: flex; flex-direction: column; overflow: hidden;
            z-index: 10000;
            opacity: 0; visibility: hidden; transform: translateY(16px) scale(0.98);
            transition: all 0.2s ease;
        }
        .chat-panel.open { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }

        .chat-header {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 14px; background: var(--bg-base); border-bottom: 1px solid var(--border);
        }
        .chat-header-avatar {
            width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
            background: var(--brand-yellow); color: var(--brand-yellow-fg);
            display: flex; align-items: center; justify-content: center; font-size: 17px;
        }
        .chat-header-info { flex: 1; min-width: 0; }
        .chat-header-title { font-size: 14px; font-weight: 700; color: var(--text-primary); }
        .chat-header-status { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
        .chat-header-status .dot {
            width: 6px; height: 6px; border-radius: 50%; background: #22c55e; display: inline-block;
        }
        .chat-header-actions { display: flex; gap: 6px; }
        .chat-icon-btn {
            width: 28px; height: 28px; border-radius: 6px; border: none;
            background: var(--btn-default-bg); color: var(--btn-default-fg);
            cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, color 0.2s;
        }
        .chat-icon-btn:hover { background: var(--btn-default-hv); color: var(--text-primary); }

        .chat-messages {
            flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 3px;
            background:
                radial-gradient(circle at 20% 10%, color-mix(in srgb, var(--brand-yellow) 4%, transparent), transparent 40%),
                var(--bg-right);
        }
        .chat-empty { color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 20px; padding: 0 20px; line-height: 1.5; }

        .chat-row { display: flex; flex-direction: column; margin-bottom: 6px; max-width: 84%; }
        .chat-row.user { align-self: flex-end; align-items: flex-end; }
        .chat-row.admin { align-self: flex-start; align-items: flex-start; }
        .chat-author-name { font-size: 11px; font-weight: 700; color: var(--accent); margin: 0 4px 2px; }

        .chat-bubble {
            padding: 9px 12px; border-radius: 16px;
            font-size: 13.5px; line-height: 1.45; word-break: break-word; white-space: pre-wrap;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
            animation: chatBubbleIn 0.18s ease;
        }
        @keyframes chatBubbleIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-row.user .chat-bubble {
            background: var(--brand-yellow); color: var(--brand-yellow-fg);
            border-bottom-right-radius: 4px;
        }
        .chat-row.admin .chat-bubble {
            background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .chat-bubble-time { font-size: 10px; color: var(--text-muted); margin: 2px 4px 0; }

        .chat-input-row {
            display: flex; align-items: flex-end; gap: 8px; padding: 10px; border-top: 1px solid var(--border); background: var(--bg-pane);
        }
        .chat-input {
            flex: 1; resize: none; height: 38px; max-height: 90px;
            padding: 9px 12px; border-radius: 18px; border: 1px solid var(--border-input);
            background: var(--bg-input); color: var(--text-primary); font-size: 13.5px;
            font-family: inherit; outline: none;
        }
        .chat-input:focus { border-color: var(--border-focus); }
        .chat-send-btn {
            width: 38px; height: 38px; border-radius: 50%; border: none;
            background: var(--brand-yellow); color: var(--brand-yellow-fg);
            cursor: pointer; font-size: 15px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .chat-send-btn:hover { background: var(--brand-yellow-hover); }
        .chat-send-btn:disabled { opacity: 0.5; cursor: default; }

        @media (max-width: 480px) {
            .chat-fab { bottom: 16px; right: 16px; width: 52px; height: 52px; font-size: 22px; }
            .chat-panel {
                bottom: 0; right: 0; left: 0; top: auto;
                width: 100%; max-width: 100%; height: 75vh; max-height: 75vh;
                border-radius: 16px 16px 0 0;
            }
        }

        /* ── Адаптив: планшеты/узкие окна ─────────────────────────────── */
        @media (max-width: 900px) {
            .left-pane { width: 46%; min-width: 300px; }
            .right-pane { width: 54%; }
        }

        /* ── Адаптив: мобильные (~480px и ниже) ───────────────────────── */
        @media (max-width: 480px) {
            html, body { height: 100%; }
            body {
                flex-direction: column;
                height: 100dvh;
                max-height: 100dvh;
                overflow: hidden;
            }

            /* Левая панель — «резиновая» верхняя половина: header и поиск
               всегда закреплены, а список+форма скроллятся ОДНИМ блоком
               внутри отведённого места. Никогда не растёт больше 58vh,
               поэтому не может наехать на правую панель. */
            .left-pane {
                width: 100%;
                min-width: 0;
                max-height: 58vh;
                flex-shrink: 0;
                border-right: none;
                border-bottom: 1px solid var(--border);
                overflow: hidden;
            }
            .db-selector-container,
            .search-container {
                flex-shrink: 0;
            }
            .left-scroll {
                display: flex;
                flex-direction: column;
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
            .questions-list {
                flex-grow: 0;
                overflow-y: visible;
                min-height: 0;
            }

            .right-pane {
                width: 100%;
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: 16px 12px 24px;
            }

            .db-selector-container { padding: 10px 12px; }
            .db-header-row { flex-wrap: wrap; }
            .db-select { min-width: 0; font-size: 12px; }
            .btn-small { padding: 8px; font-size: 11px; }
            .btn-theme { padding: 8px; }

            .search-container { padding: 10px 12px; }

            .questions-list { padding: 10px 12px; }
            .question-item { padding: 10px 12px; margin-bottom: 6px; }
            .q-title { font-size: 13px; }

            .add-form-container { padding: 10px 12px; }
            .form-textarea { height: 44px; }

            .db-file-actions { flex-wrap: wrap; }
            .btn-file-action { flex: 1 1 45%; font-size: 11px; padding: 8px 4px; }

            .current-db-title { font-size: 11px; margin-bottom: 10px; }
            .answer-card { padding: 14px; margin-bottom: 14px; }
            .answer-header-row { padding-right: 60px; }
            .answer-title { padding-right: 60px; font-size: 16px; }
            .answer-text { font-size: 14px; }
            .btn-delete { top: 14px; right: 14px; font-size: 11px; padding: 3px 6px; }

            .modal-overlay { padding: 16px; }
            .modal-box { width: 100%; max-width: 100%; max-height: 85vh; overflow-y: auto; padding: 18px; }
            .modal-title { font-size: 16px; }
            .modal-desc { font-size: 13px; }
            .modal-buttons { flex-wrap: wrap; }
            .modal-btn { flex: 1 1 auto; }

            .toast {
                left: 12px; right: 12px; bottom: 12px;
                text-align: center; font-size: 13px;
            }
        }

        /* ── Адаптив: совсем узкие (~375px и ниже) ────────────────────── */
        @media (max-width: 375px) {
            .left-pane { max-height: 62vh; }
            .db-header-row { gap: 6px; }
            .btn-small { font-size: 10px; padding: 7px 6px; }
            .search-input, .form-input, .form-textarea { font-size: 13px; padding: 8px 10px; }
            .btn-file-action { flex: 1 1 100%; }
            .btn-delete { top: 12px; right: 12px; font-size: 10px; padding: 3px 5px; }
            .answer-header-row, .answer-title { padding-right: 52px; }
        }

        /* ── Адаптив: короткий экран по высоте (альбомная ориентация телефона) ──
           Если высоты не хватает даже на 58vh с шапкой, левая панель сама
           получает scroll — но не может «вылезти» за пределы экрана. */
        @media (max-width: 480px) and (max-height: 480px) {
            .left-pane { max-height: 72vh; overflow-y: auto; }
        }
    </style>
</head>

<script>
// Все базы читаются/пишутся через серверные функции /api/dbs (см. api/dbs.js),
// которые от имени сервера обращаются к GitHub Contents API. Токен GitHub
// хранится только в переменных окружения Vercel и никогда не попадает в браузер.

// ── Состояние ──────────────────────────────────────────────────────────
let dbList = [];          // ['имя1.json', 'имя2.json', ...]
let currentDbName = '';
let currentDbData = [];   // вопросы текущей базы

// ── Тема ───────────────────────────────────────────────────────────────
function applyTheme(theme) {
    const btn = document.getElementById('btnTheme');
    if (theme === 'light') {
        document.body.classList.add('light');
        btn.textContent = '🌙';
        btn.title = 'Переключить на тёмную тему';
    } else {
        document.body.classList.remove('light');
        btn.textContent = '☀️';
        btn.title = 'Переключить на светлую тему';
    }
    localStorage.setItem('theme', theme);
}

document.getElementById('btnTheme').addEventListener('click', () => {
    const isDark = !document.body.classList.contains('light');
    applyTheme(isDark ? 'light' : 'dark');
});

// Применяем сохранённую тему (по умолчанию — светлая)
applyTheme(localStorage.getItem('theme') || 'light');

// ── Утилиты ────────────────────────────────────────────────────────────
function escapeHtml(t) {
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show ' + type;
    clearTimeout(el._timer);
    el._timer = setTimeout(() => { el.className = 'toast'; }, 3000);
}

// ── API: базы хранятся и меняются на GitHub через серверную функцию ────
async function apiListDbs() {
    const res = await fetch('/api/dbs');
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `Ошибка сервера (${res.status})`);
    }
    return res.json();
}

async function apiGetDb(name) {
    const res = await fetch(`/api/dbs?name=${encodeURIComponent(name)}`);
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `Ошибка сервера (${res.status})`);
    }
    return res.json();
}

async function apiSaveDb(name, data, category) {
    const body = { name, data };
    if (category !== undefined) body.category = category;
    const res = await fetch('/api/dbs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `Ошибка сервера (${res.status})`);
    }
    return res.json();
}

async function apiDeleteDb(name) {
    const res = await fetch(`/api/dbs?name=${encodeURIComponent(name)}`, { method: 'DELETE' });
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `Ошибка сервера (${res.status})`);
    }
    return res.json();
}

// ── Modal ──────────────────────────────────────────────────────────────
function showModal(options) {
    const overlay = document.getElementById('customModal');
    document.getElementById('modalTitle').textContent = options.title || '';
    document.getElementById('modalDesc').textContent = options.desc || '';
    const fieldsEl = document.getElementById('modalFields');
    fieldsEl.innerHTML = '';

    if (options.fields) {
        options.fields.forEach(f => {
            const label = document.createElement('label');
            label.className = 'modal-label';
            label.textContent = f.label;
            const input = document.createElement(f.type === 'textarea' ? 'textarea' : 'input');
            input.className = 'modal-input' + (f.type === 'textarea' ? ' modal-textarea' : '');
            if (f.type !== 'textarea') input.type = 'text';
            input.id = 'mfield_' + f.name;
            input.placeholder = f.placeholder || '';
            input.value = f.value || '';
            fieldsEl.appendChild(label);
            fieldsEl.appendChild(input);
        });
    } else if (options.type === 'prompt') {
        const input = document.createElement('input');
        input.className = 'modal-input';
        input.type = options.inputType || 'text';
        input.id = 'mfield_single';
        input.placeholder = options.placeholder || '';
        input.value = options.defaultValue || '';
        fieldsEl.appendChild(input);
    }

    const cancelBtn = document.getElementById('modalBtnCancel');
    const confirmBtn = document.getElementById('modalBtnConfirm');
    cancelBtn.style.display = options.type === 'alert' ? 'none' : 'inline-block';
    confirmBtn.className = 'modal-btn ' + (options.confirmClass || 'confirm');
    confirmBtn.textContent = options.confirmText || 'OK';
    overlay.classList.add('open');

    return new Promise(resolve => {
        const done = (val) => {
            overlay.classList.remove('open');
            confirmBtn.removeEventListener('click', onConfirm);
            cancelBtn.removeEventListener('click', onCancel);
            document.removeEventListener('keydown', onKey);
            resolve(val);
        };
        const onConfirm = () => {
            if (options.fields) {
                const result = {};
                options.fields.forEach(f => {
                    result[f.name] = document.getElementById('mfield_' + f.name).value.trim();
                });
                done(result);
            } else if (options.type === 'prompt') {
                done(document.getElementById('mfield_single').value);
            } else {
                done(true);
            }
        };
        const onCancel = () => done(options.fields || options.type === 'prompt' ? null : false);
        const onKey = (e) => {
            if (e.key === 'Enter' && e.target.tagName === 'TEXTAREA' && !e.ctrlKey) return; // перенос строки
            if (e.key === 'Enter') onConfirm();
            else if (e.key === 'Escape') onCancel();
        };
        confirmBtn.addEventListener('click', onConfirm);
        cancelBtn.addEventListener('click', onCancel);
        document.addEventListener('keydown', onKey);

        // Фокус на первом поле
        setTimeout(() => {
            const first = fieldsEl.querySelector('input') || document.getElementById('mfield_single');
            if (first) { first.focus(); first.select(); }
        }, 50);
    });
}

// ── Пароль на удаление ───────────────────────────────────────────────
const DELETE_PASSWORD = '0404';
async function confirmDeleteWithPassword(desc) {
    const pass = await showModal({
        title: 'Подтверждение удаления',
        desc: desc || 'Введите пароль для удаления:',
        type: 'prompt',
        inputType: 'password',
        placeholder: 'Пароль',
        confirmText: 'Удалить',
        confirmClass: 'danger'
    });
    if (pass === null) return false;
    if (pass !== DELETE_PASSWORD) {
        showToast('Неверный пароль', 'error');
        return false;
    }
    return true;
}

// ── Обновление списка баз с сервера (реальное состояние репозитория) ───
// dbList: [{ name: 'файл.json', category: 'Категория или пусто' }, ...]
async function refreshDbList(keepActive = true) {
    const emptyEl = document.getElementById('emptyState');
    if (emptyEl) emptyEl.textContent = '⏳ Загружаю список баз...';
    try {
        dbList = await apiListDbs();
        if (!keepActive || !currentDbName || !dbList.some(e => e.name === currentDbName)) {
            currentDbName = dbList.length > 0 ? dbList[0].name : '';
        }
        updateDbSelectUI();
        await loadCurrentDb();
    } catch (err) {
        showToast('Ошибка: ' + err.message, 'error');
        if (emptyEl) emptyEl.textContent = 'Не удалось загрузить список баз с сервера.';
    }
}

// ── UI ─────────────────────────────────────────────────────────────────
function updateDbSelectUI() {
    const sel = document.getElementById('dbSelect');
    sel.innerHTML = '';

    // Группируем по категории — некатегоризированные идут отдельным блоком
    const groups = new Map();
    dbList.forEach(entry => {
        const cat = entry.category || '';
        if (!groups.has(cat)) groups.set(cat, []);
        groups.get(cat).push(entry);
    });

    const appendOptions = (container, entries) => {
        entries.forEach(entry => {
            const opt = document.createElement('option');
            opt.value = entry.name;
            opt.textContent = entry.name.replace('.json', '');
            if (entry.name === currentDbName) opt.selected = true;
            container.appendChild(opt);
        });
    };

    // Сначала именованные категории, потом "Без категории"
    Array.from(groups.keys()).filter(c => c).sort().forEach(cat => {
        const group = document.createElement('optgroup');
        group.label = cat;
        appendOptions(group, groups.get(cat));
        sel.appendChild(group);
    });
    if (groups.has('')) {
        const uncategorized = groups.get('');
        if (groups.size > 1) {
            const group = document.createElement('optgroup');
            group.label = 'Без категории';
            appendOptions(group, uncategorized);
            sel.appendChild(group);
        } else {
            appendOptions(sel, uncategorized);
        }
    }

    updateDbLabel();
}

function updateDbLabel() {
    const entry = dbList.find(e => e.name === currentDbName);
    const category = entry && entry.category ? ` [${escapeHtml(entry.category)}]` : '';
    document.getElementById('dbNameLabel').innerHTML =
        `Текущая база: ${escapeHtml(currentDbName.replace('.json','') || '—')}${category ? `<span class="category-badge">${category}</span>` : ''} — (Вопросов: ${currentDbData.length})`;
}

async function loadCurrentDb() {
    if (!currentDbName) { currentDbData = []; renderCards(); return; }
    try {
        currentDbData = await apiGetDb(currentDbName);
        renderCards();
    } catch (err) {
        currentDbData = [];
        renderCards();
        showToast('Не удалось загрузить базу: ' + err.message, 'error');
    }
}

function renderCards() {
    const pane = document.getElementById('rightPane');
    Array.from(pane.getElementsByClassName('answer-card')).forEach(c => c.remove());
    updateDbLabel();

    let emptyState = document.getElementById('emptyState');
    if (currentDbData.length === 0) {
        if (!emptyState) {
            const p = document.createElement('div');
            p.id = 'emptyState'; p.className = 'empty-placeholder';
            p.textContent = 'База данных пуста.';
            pane.appendChild(p);
        } else {
            emptyState.textContent = 'База данных пуста.';
        }
    } else {
        if (emptyState) emptyState.remove();
        currentDbData.forEach((item, i) => {
            const card = document.createElement('div');
            card.className = 'answer-card';
            card.setAttribute('data-id', item.id);
            card.innerHTML = `
                <button class="btn-delete" data-id="${item.id}">Удалить</button>
                <div class="answer-header-row">
                    <span class="answer-number">№ ${i + 1} из ${currentDbData.length}</span>
                </div>
                <div class="answer-title">${escapeHtml(item.title)}</div>
                <div class="answer-text">${escapeHtml(item.text)}</div>
            `;
            card.querySelector('.btn-delete').addEventListener('click', () => deleteCard(item.id));
            pane.appendChild(card);
        });
    }
    buildSearchList();
}

function buildSearchList() {
    const list = document.getElementById('questionsList');
    list.innerHTML = '';
    const cards = Array.from(document.getElementById('rightPane').getElementsByClassName('answer-card'));
    cards.forEach(card => {
        const id = card.getAttribute('data-id');
        const title = card.querySelector('.answer-title').textContent;
        const body = card.querySelector('.answer-text').textContent;
        const item = document.createElement('div');
        item.className = 'question-item';
        item.setAttribute('data-id', id);
        item.setAttribute('data-search', (title + ' ' + body).toLowerCase());
        item.innerHTML = `<div class="q-title">${escapeHtml(title)}</div>`;
        item.addEventListener('click', () => {
            document.querySelectorAll('.question-item').forEach(el => el.classList.remove('active'));
            item.classList.add('active');
            cards.forEach(c => c.classList.remove('highlight'));
            card.classList.add('highlight');
            card.scrollIntoView({ behavior: 'auto', block: 'center' });
        });
        list.appendChild(item);
    });
    applySearch();
}

function applySearch() {
    const searchBox = document.getElementById('searchBox');
    const q = searchBox.value.trim().toLowerCase();
    document.getElementById('btnClearSearch').classList.toggle('show', q.length > 0);
    document.querySelectorAll('.question-item').forEach(item => {
        if (!q) { item.style.display = 'none'; return; }
        const match = q.split(/\s+/).every(t => item.getAttribute('data-search').includes(t));
        item.style.display = match ? 'block' : 'none';
    });
}

// ── События ────────────────────────────────────────────────────────────
document.getElementById('searchBox').addEventListener('input', applySearch);
document.getElementById('btnClearSearch').addEventListener('click', () => {
    const searchBox = document.getElementById('searchBox');
    searchBox.value = '';
    applySearch();
    searchBox.focus();
});

document.getElementById('dbSelect').addEventListener('change', async e => {
    currentDbName = e.target.value;
    document.getElementById('searchBox').value = '';
    await loadCurrentDb();
});

document.getElementById('btnRefresh').addEventListener('click', () => refreshDbList(true));

document.getElementById('btnDeleteDb').addEventListener('click', async () => {
    if (!currentDbName) return;
    const ok = await confirmDeleteWithPassword(`Удалить базу «${currentDbName.replace('.json','')}» из репозитория GitHub? Это необратимо. Введите пароль:`);
    if (!ok) return;
    try {
        await apiDeleteDb(currentDbName);
        dbList = dbList.filter(e => e.name !== currentDbName);
        currentDbName = dbList.length > 0 ? dbList[0].name : '';
        updateDbSelectUI();
        await loadCurrentDb();
        showToast('База удалена из репозитория', 'success');
    } catch (err) {
        showToast('Не удалось удалить базу: ' + err.message, 'error');
    }
});

document.getElementById('btnAdd').addEventListener('click', async () => {
    const result = await showModal({
        title: '+ Новый вопрос',
        fields: [
            { name: 'title', label: 'Заголовок / вопрос', type: 'text', placeholder: 'Введите вопрос...' },
            { name: 'text', label: 'Текст ответа', type: 'textarea', placeholder: 'Введите ответ...' },
        ],
        confirmText: 'Добавить'
    });
    if (!result) return;

    const title = result.title.trim();
    const text = result.text.trim();
    if (!title || !text) {
        await showModal({ title: 'Внимание', desc: 'Заполни оба поля!', type: 'alert' }); return;
    }
    const isDuplicate = currentDbData.some(item =>
        item.title.trim().toLowerCase() === title.toLowerCase()
    );
    if (isDuplicate) {
        showToast('Вопрос с таким заголовком уже есть в базе — повторное добавление отменено', 'error');
        return;
    }
    let isNewDb = false;
    let dbNameForNew = currentDbName;
    let categoryForNew;
    if (!currentDbName) {
        // Предложим создать новую базу
        const newDb = await showModal({
            title: 'Новая база',
            fields: [
                { name: 'dbname', label: 'Название базы', placeholder: 'новая_база' },
                { name: 'category', label: 'Категория (необязательно)', placeholder: 'например: 1С Платформа' },
            ],
            confirmText: 'Создать'
        });
        if (!newDb || !newDb.dbname) return;
        let fn = newDb.dbname;
        if (!fn.endsWith('.json')) fn += '.json';
        if (dbList.some(e => e.name === fn)) { showToast('База с таким именем уже существует', 'error'); return; }
        dbNameForNew = fn;
        categoryForNew = newDb.category || '';
        isNewDb = true;
    }

    const newItem = { id: Date.now().toString(), title, text };
    const dataToSave = [...currentDbData, newItem];

    try {
        await apiSaveDb(dbNameForNew, dataToSave, isNewDb ? categoryForNew : undefined);
        if (isNewDb) {
            dbList.push({ name: dbNameForNew, category: categoryForNew });
            currentDbName = dbNameForNew;
            updateDbSelectUI();
        }
        currentDbData = dataToSave;
        renderCards();
        showToast('Вопрос сохранён в GitHub', 'success');
    } catch (err) {
        showToast('Не удалось сохранить в GitHub: ' + err.message, 'error');
    }
});

async function deleteCard(id) {
    const ok = await confirmDeleteWithPassword('Удалить этот вопрос? Введите пароль:');
    if (!ok) return;
    const previousData = currentDbData;
    const newData = currentDbData.filter(i => i.id !== id);
    try {
        await apiSaveDb(currentDbName, newData);
        currentDbData = newData;
        renderCards();
        showToast('Вопрос удалён из GitHub', 'success');
    } catch (err) {
        showToast('Не удалось удалить: ' + err.message, 'error');
        currentDbData = previousData;
    }
}

document.getElementById('btnExport').addEventListener('click', () => {
    if (!currentDbName) { showToast('Нет активной базы', 'error'); return; }
    const json = JSON.stringify(currentDbData, null, 2);
    const a = document.createElement('a');
    a.href = 'data:text/json;charset=utf-8,' + encodeURIComponent(json);
    a.download = currentDbName;
    document.body.appendChild(a); a.click(); a.remove();
});

document.getElementById('btnImport').addEventListener('click', () => {
    document.getElementById('filePicker').click();
});

document.getElementById('filePicker').addEventListener('change', e => {
    Array.from(e.target.files || []).forEach(file => {
        const reader = new FileReader();
        reader.onload = async ev => {
            try {
                const json = JSON.parse(ev.target.result);
                const data = Array.isArray(json) ? json : (Array.isArray(json.data) ? json.data : null);
                if (!data) { showToast(`${file.name}: не массив`, 'error'); return; }
                const fn = file.name.endsWith('.json') ? file.name : file.name + '.json';

                await apiSaveDb(fn, data);
                if (!dbList.some(e => e.name === fn)) dbList.push({ name: fn, category: '' });
                currentDbName = fn;
                currentDbData = data;
                updateDbSelectUI();
                renderCards();
                showToast(`Загружено в GitHub: ${fn}`, 'success');
            } catch(err) {
                showToast(`Ошибка загрузки "${file.name}": ` + err.message, 'error');
            }
        };
        reader.readAsText(file);
    });
    e.target.value = '';
});

// ── Telegram-чат (плавающая кнопка) ─────────────────────────────────────
function getChatSessionId() {
    let id = localStorage.getItem('chatSessionId');
    if (!id) {
        id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
        localStorage.setItem('chatSessionId', id);
    }
    return id;
}
const chatSessionId = getChatSessionId();

const chatFab = document.getElementById('chatFab');
const chatBadge = document.getElementById('chatBadge');
const chatPanel = document.getElementById('chatPanel');
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const chatSendBtn = document.getElementById('chatSendBtn');

let chatPollTimer = null;
let chatRenderedIds = new Set();
let chatIsOpen = false;
let chatUnreadCount = 0;

function formatChatTime(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

function updateChatBadge() {
    if (chatUnreadCount > 0) {
        chatBadge.textContent = chatUnreadCount > 9 ? '9+' : String(chatUnreadCount);
        chatBadge.classList.add('show');
        chatFab.classList.add('unread');
    } else {
        chatBadge.classList.remove('show');
        chatFab.classList.remove('unread');
    }
}

function renderChatMessages(messages) {
    if (messages.length === 0) {
        chatMessages.innerHTML = '<div class="chat-empty">Напишите вопрос — он придёт нам в Telegram, ответ появится здесь.</div>';
        chatRenderedIds = new Set();
        return;
    }
    const wasAtBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight < 40;
    const newIds = new Set(messages.map(m => m.id));
    const newAdminMessages = messages.filter(m => m.from === 'admin' && !chatRenderedIds.has(m.id));

    // Подпись с именем показываем только на первом сообщении в подряд идущей
    // группе от одного и того же автора — как в обычных мессенджерах.
    let prevFrom = null;
    chatMessages.innerHTML = messages.map(m => {
        const showAuthor = m.from === 'admin' && m.authorName && prevFrom !== (m.authorName || m.from);
        prevFrom = m.from === 'admin' ? (m.authorName || m.from) : m.from;
        return `
        <div class="chat-row ${m.from === 'admin' ? 'admin' : 'user'}">
            ${showAuthor ? `<div class="chat-author-name">${escapeHtml(m.authorName)}</div>` : ''}
            <div class="chat-bubble">${escapeHtml(m.text)}</div>
            <div class="chat-bubble-time">${formatChatTime(m.ts)}</div>
        </div>`;
    }).join('');
    chatRenderedIds = newIds;

    if (wasAtBottom || newAdminMessages.length > 0) {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    if (newAdminMessages.length > 0 && !chatIsOpen) {
        chatUnreadCount += newAdminMessages.length;
        updateChatBadge();
        const last = newAdminMessages[newAdminMessages.length - 1];
        showToast(`💬 ${last.authorName ? last.authorName + ': ' : ''}${last.text.slice(0, 80)}`, 'success');
    }
}

async function chatPollOnce() {
    try {
        const res = await fetch(`/api/chat/poll?sessionId=${encodeURIComponent(chatSessionId)}`);
        if (!res.ok) return;
        const { messages } = await res.json();
        renderChatMessages(messages || []);
    } catch {
        // тихо игнорируем сетевые сбои поллинга
    }
}

function startChatPolling() {
    if (chatPollTimer) return;
    chatPollOnce();
    chatPollTimer = setInterval(chatPollOnce, 3000);
}
function stopChatPolling() {
    clearInterval(chatPollTimer);
    chatPollTimer = null;
}

function openChat() {
    chatIsOpen = true;
    chatPanel.classList.add('open');
    chatUnreadCount = 0;
    updateChatBadge();
    startChatPolling();
    setTimeout(() => chatInput.focus(), 100);
}
function closeChat() {
    chatIsOpen = false;
    chatPanel.classList.remove('open');
    stopChatPolling();
}

chatFab.addEventListener('click', () => {
    if (chatIsOpen) closeChat(); else openChat();
});
document.getElementById('chatCloseBtn').addEventListener('click', closeChat);

document.getElementById('chatClearBtn').addEventListener('click', async () => {
    const ok = await showModal({
        title: 'Очистить чат?',
        desc: 'История переписки будет удалена безвозвратно.',
        type: 'confirm', confirmText: 'Очистить', confirmClass: 'danger'
    });
    if (!ok) return;
    try {
        await fetch('/api/chat/clear', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId: chatSessionId }),
        });
        renderChatMessages([]);
        showToast('Чат очищен', 'success');
    } catch (err) {
        showToast('Не удалось очистить чат: ' + err.message, 'error');
    }
});

async function sendChatMessage() {
    const text = chatInput.value.trim();
    if (!text) return;
    chatSendBtn.disabled = true;
    try {
        const res = await fetch('/api/chat/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId: chatSessionId, text }),
        });
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || `Ошибка сервера (${res.status})`);
        }
        chatInput.value = '';
        chatInput.style.height = '38px';
        await chatPollOnce();
    } catch (err) {
        showToast('Не удалось отправить: ' + err.message, 'error');
    } finally {
        chatSendBtn.disabled = false;
    }
}

chatSendBtn.addEventListener('click', sendChatMessage);
chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChatMessage();
    }
});
chatInput.addEventListener('input', () => {
    chatInput.style.height = '38px';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 90) + 'px';
});

// ── Скрыть/показать блок добавления вопроса (состояние сохраняется) ─────
const addFormContainer = document.getElementById('addFormContainer');
const panelToggle = document.getElementById('panelToggle');

function applyFormCollapsed(collapsed) {
    addFormContainer.classList.toggle('collapsed', collapsed);
    panelToggle.textContent = collapsed ? '▲ Показать панель' : '▼ Скрыть панель';
    panelToggle.title = collapsed ? 'Показать панель добавления' : 'Скрыть панель добавления';
}

applyFormCollapsed(localStorage.getItem('addFormCollapsed') === '1');

panelToggle.addEventListener('click', () => {
    const collapsed = !addFormContainer.classList.contains('collapsed');
    applyFormCollapsed(collapsed);
    localStorage.setItem('addFormCollapsed', collapsed ? '1' : '0');
});

// ── Закрытие чата по Esc и клику вне окна ────────────────────────────────
document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && chatIsOpen) closeChat();
});
document.addEventListener('click', e => {
    if (chatIsOpen && !chatPanel.contains(e.target) && !chatFab.contains(e.target)) {
        closeChat();
    }
});

// ── Инициализация ──────────────────────────────────────────────────────
refreshDbList();
</script>
</body>
</html>
