<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт-шпион с мини-базой</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        /* ЛЕВАЯ ПАНЕЛЬ */
        .left-pane {
            width: 40%;
            min-width: 320px;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            background: #1e293b;
        }
        .search-container {
            padding: 15px;
            border-bottom: 1px solid #334155;
            background: #1e293b;
        }
        .search-input, .form-input, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus, .form-input:focus, .form-textarea:focus {
            border-color: #38bdf8;
        }
        
        .questions-list {
            overflow-y: auto;
            flex-grow: 1;
            padding: 15px;
        }
        .question-item {
            display: none; /* Скрыты по умолчанию, пока ничего не введено */
            padding: 12px 15px;
            margin-bottom: 8px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .question-item:hover {
            border-color: #38bdf8;
            background: #1e293b;
        }
        .question-item.active {
            border-color: #38bdf8;
            background: #1e3a8a;
        }
        .q-title {
            font-weight: 600;
            font-size: 14px;
            color: #f8fafc;
            word-break: break-word;
        }

        /* Управление базой и форма добавления внизу */
        .add-form-container {
            padding: 15px;
            border-top: 1px solid #334155;
            background: #1e293b;
        }
        .form-group {
            margin-bottom: 8px;
        }
        .form-textarea {
            resize: vertical;
            height: 50px;
        }
        .btn-add {
            width: 100%;
            padding: 10px;
            background: #0ea5e9;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-add:hover {
            background: #0284c7;
        }
        .db-controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-db {
            flex: 1;
            padding: 7px;
            background: #334155;
            border: none;
            border-radius: 6px;
            color: #cbd5e1;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-db:hover {
            background: #475569;
            color: #fff;
        }
        #importFile {
            display: none;
        }

        /* ПРАВАЯ ПАНЕЛЬ */
        .right-pane {
            width: 60%;
            padding: 30px;
            overflow-y: auto;
            background: #0b0f19;
        }
        .empty-placeholder {
            color: #64748b;
            text-align: center;
            margin-top: 50px;
            font-size: 15px;
        }
        .answer-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .answer-card.highlight {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }
        .answer-title {
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 10px;
            padding-right: 70px;
            word-break: break-word;
        }
        .answer-text {
            color: #94a3b8;
            line-height: 1.5;
            font-size: 15px;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .btn-delete {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .btn-delete:hover {
            background: #ef4444;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="left-pane">
        <div class="search-container">
            <input type="text" id="searchBox" class="search-input" placeholder="🔍 Глубокий умный поиск по тексту..." autofocus>
        </div>
        
        <div id="questionsList" class="questions-list">
            </div>

        <div class="add-form-container">
            <div class="form-group">
                <input type="text" id="newTitle" class="form-input" placeholder="Заголовок / вопрос...">
            </div>
            <div class="form-group">
                <textarea id="newText" class="form-textarea" placeholder="Текст ответа..."></textarea>
            </div>
            <button id="btnAdd" class="btn-add">+ Добавить вопрос-ответ</button>
            
            <div class="db-controls">
                <button class="btn-db" id="btnExport">💾 Скачать базу</button>
                <button class="btn-db" id="btnImportTrigger">📂 Загрузить базу</button>
                <input type="file" id="importFile" accept=".json">
            </div>
        </div>
    </div>

    <div class="right-pane" id="rightPane">
        <div id="emptyState" class="empty-placeholder">Список пуст. Добавьте первый вопрос через форму слева.</div>
    </div>

    <script>
        const searchBox = document.getElementById('searchBox');
        const questionsList = document.getElementById('questionsList');
        const rightPane = document.getElementById('rightPane');
        const emptyState = document.getElementById('emptyState');
        const importFileInput = document.getElementById('importFile');

        // Загрузка данных из памяти браузера (localStorage) при старте
        function loadDatabase() {
            const savedData = localStorage.getItem('spy_database');
            if (savedData) {
                try {
                    const cardsData = JSON.parse(savedData);
                    renderCards(cardsData);
                } catch (e) {
                    console.error('Ошибка чтения базы данных', e);
                }
            }
            initList();
        }

        // Сохранение текущих карточек в память браузера
        function saveDatabase() {
            const cards = Array.from(rightPane.getElementsByClassName('answer-card'));
            const cardsData = cards.map(card => {
                return {
                    id: card.getAttribute('data-id'),
                    title: card.querySelector('.answer-title').textContent,
                    text: card.querySelector('.answer-text').textContent
                };
            });
            localStorage.setItem('spy_database', JSON.stringify(cardsData));
        }

        // Рендер карточек в правую панель из массива данных
        function renderCards(cardsData) {
            // Удаляем старые карточки, оставляя заглушку если есть
            const existingCards = rightPane.getElementsByClassName('answer-card');
            Array.from(existingCards).forEach(c => c.remove());

            cardsData.forEach(item => {
                const newCard = document.createElement('div');
                newCard.className = 'answer-card';
                newCard.setAttribute('data-id', item.id);
                newCard.innerHTML = `
                    <button class="btn-delete" onclick="deleteCard(this)">Удалить</button>
                    <div class="answer-title">${escapeHtml(item.title)}</div>
                    <div class="answer-text">${escapeHtml(item.text)}</div>
                `;
                rightPane.appendChild(newCard);
            });
        }

        function initList() {
            questionsList.innerHTML = '';
            const cards = Array.from(rightPane.getElementsByClassName('answer-card'));

            if (cards.length === 0) {
                if (!document.getElementById('emptyState')) {
                    const placeholder = document.createElement('div');
                    placeholder.id = 'emptyState';
                    placeholder.className = 'empty-placeholder';
                    placeholder.textContent = 'Список пуст. Добавьте первый вопрос через форму слева.';
                    rightPane.appendChild(placeholder);
                }
            } else {
                const placeholder = document.getElementById('emptyState');
                if (placeholder) {
                    placeholder.remove();
                }
            }

            cards.forEach(card => {
                const cardId = card.getAttribute('data-id');
                const titleText = card.querySelector('.answer-title').textContent;
                const bodyText = card.querySelector('.answer-text').textContent;
                
                const item = document.createElement('div');
                item.className = 'question-item';
                item.setAttribute('data-id', cardId);
                item.setAttribute('data-search', (titleText + " " + bodyText).toLowerCase());
                item.innerHTML = `<div class="q-title">${titleText}</div>`;

                item.addEventListener('click', () => {
                    document.querySelectorAll('.question-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');

                    cards.forEach(c => c.classList.remove('highlight'));
                    card.classList.add('highlight');
                    
                    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });

                questionsList.appendChild(item);
            });

            applySmartSearch();
        }

        // Глубокий умный поиск по тексту
        function applySmartSearch() {
            const rawQuery = searchBox.value.trim().toLowerCase();
            const items = questionsList.getElementsByClassName('question-item');

            Array.from(items).forEach(item => {
                const searchContent = item.getAttribute('data-search');
                
                if (rawQuery === '') {
                    item.style.display = 'none';
                } else {
                    const queryTerms = rawQuery.split(/\s+/).filter(term => term.length > 0);
                    const isMatch = queryTerms.every(term => searchContent.includes(term));

                    if (isMatch) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                }
            });
        }

        searchBox.addEventListener('input', applySmartSearch);

        // Добавление с защитой от дубликатов
        document.getElementById('btnAdd').addEventListener('click', () => {
            const titleInput = document.getElementById('newTitle');
            const textInput = document.getElementById('newText');
            
            const title = titleInput.value.trim();
            const text = textInput.value.trim();

            if (!title || !text) {
                alert('Заполните заголовок и текст ответа!');
                return;
            }

            const existingCards = Array.from(rightPane.getElementsByClassName('answer-card'));
            const isDuplicate = existingCards.some(card => {
                const existingTitle = card.querySelector('.answer-title').textContent.trim().toLowerCase();
                return existingTitle === title.toLowerCase();
            });

            if (isDuplicate) {
                alert('Ошибка: Вопрос с таким заголовком уже существует!');
                return;
            }

            const newCardId = Date.now().toString(); // Уникальный ID на базе времени
            const newCard = document.createElement('div');
            newCard.className = 'answer-card';
            newCard.setAttribute('data-id', newCardId);
            newCard.innerHTML = `
                <button class="btn-delete" onclick="deleteCard(this)">Удалить</button>
                <div class="answer-title">${escapeHtml(title)}</div>
                <div class="answer-text">${escapeHtml(text)}</div>
            `;
            
            rightPane.appendChild(newCard);

            titleInput.value = '';
            textInput.value = '';

            saveDatabase(); // Сохраняем в память
            initList();
            searchBox.focus();
        });

        // Удаление карточки
        window.deleteCard = function(button) {
            if (confirm('Вы действительно хотите удалить этот вопрос и ответ?')) {
                const card = button.closest('.answer-card');
                card.remove();
                saveDatabase(); // Сохраняем изменения в память
                initList();
                searchBox.focus();
            }
        };

        // Кнопка экспорта (скачать базу в файл .json)
        document.getElementById('btnExport').addEventListener('click', () => {
            const cards = Array.from(rightPane.getElementsByClassName('answer-card'));
            if (cards.length === 0) {
                alert('База пуста, нечего скачивать!');
                return;
            }
            const cardsData = cards.map(card => ({
                id: card.getAttribute('data-id'),
                title: card.querySelector('.answer-title').textContent,
                text: card.querySelector('.answer-text').textContent
            }));

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cardsData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "spy_database.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        });

        // Кнопка импорта (клик по скрытому инпуту файла)
        document.getElementById('btnImportTrigger').addEventListener('click', () => {
            importFileInput.click();
        });

        // Загрузка базы из файла .json
        importFileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        renderCards(importedData);
                        saveDatabase();
                        initList();
                        alert('База успешно загружена!');
                    } else {
                        alert('Ошибка формата файла!');
                    }
                } catch (err) {
                    alert('Ошибка чтения JSON файла!');
                }
                importFileInput.value = ''; // Сбрасываем инпут
            };
            reader.readAsText(file);
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Инициализация при загрузке страницы
        loadDatabase();
    </script>
</body>
</html>
