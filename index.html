<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт-шпион с папкой Baza</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        .left-pane {
            width: 42%;
            min-width: 340px;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            background: #1e293b;
        }

        .db-selector-container {
            padding: 12px 15px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .db-header-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .db-select {
            flex-grow: 1;
            padding: 8px 10px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        .btn-small {
            padding: 8px 12px;
            background: #334155;
            border: none;
            border-radius: 6px;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn-small:hover { background: #475569; color: #fff; }
        .btn-small.danger { background: #7f1d1d; color: #fca5a5; }
        .btn-small.danger:hover { background: #991b1b; color: #fff; }

        .search-container {
            padding: 12px 15px;
            border-bottom: 1px solid #334155;
            background: #1e293b;
        }
        .search-input, .form-input, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus, .form-input:focus, .form-textarea:focus { border-color: #38bdf8; }
        
        .questions-list {
            overflow-y: auto;
            flex-grow: 1;
            padding: 15px;
        }
        .question-item {
            display: none;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .question-item:hover { border-color: #38bdf8; background: #1e293b; }
        .question-item.active { border-color: #38bdf8; background: #1e3a8a; }
        .q-title { font-weight: 600; font-size: 14px; color: #f8fafc; word-break: break-word; }

        .add-form-container {
            padding: 15px;
            border-top: 1px solid #334155;
            background: #1e293b;
        }
        .form-group { margin-bottom: 8px; }
        .form-textarea { resize: vertical; height: 50px; }
        .btn-add {
            width: 100%;
            padding: 10px;
            background: #0ea5e9;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-add:hover { background: #0284c7; }
        
        .db-file-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .btn-file-action {
            flex: 1;
            padding: 8px 6px;
            background: #0369a1;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }
        .btn-file-action:hover { background: #0284c7; }
        #importFile { display: none; }

        .right-pane {
            width: 58%;
            padding: 30px;
            overflow-y: auto;
            background: #0b0f19;
        }
        .current-db-title {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .empty-placeholder { color: #64748b; text-align: center; margin-top: 50px; font-size: 15px; }
        .answer-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }
        .answer-card.highlight { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        .answer-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-right: 70px; }
        .answer-number { font-size: 12px; font-weight: 600; color: #38bdf8; background: #0f172a; padding: 3px 8px; border-radius: 4px; border: 1px solid #334155; }
        .answer-title { font-size: 18px; font-weight: bold; color: #f8fafc; margin-bottom: 10px; word-break: break-word; }
        .answer-text { color: #94a3b8; line-height: 1.5; font-size: 15px; word-break: break-word; white-space: pre-wrap; }
        .btn-delete {
            position: absolute; top: 20px; right: 20px;
            background: transparent; border: 1px solid #ef4444; color: #ef4444;
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
            transition: all 0.2s;
        }
        .btn-delete:hover { background: #ef4444; color: #fff; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(2px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.2s ease;
        }
        .modal-overlay.open { opacity: 1; visibility: visible; }
        .modal-box {
            background: #1e293b; border: 1px solid #334155; border-radius: 10px;
            width: 400px; max-width: 90%; padding: 24px; box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }
        .modal-title { font-size: 18px; font-weight: 600; color: #f8fafc; margin-bottom: 10px; }
        .modal-desc { font-size: 14px; color: #94a3b8; margin-bottom: 16px; line-height: 1.5; }
        .modal-input {
            width: 100%; padding: 10px 14px; background: #0f172a;
            border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 14px; outline: none; margin-bottom: 20px;
        }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-btn { padding: 9px 18px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; }
        .modal-btn.cancel { background: #334155; color: #cbd5e1; }
        .modal-btn.confirm { background: #0ea5e9; color: #fff; }
        .modal-btn.danger { background: #ef4444; color: #fff; }
    </style>
</head>
<body>

    <div class="left-pane">
        <div class="db-selector-container">
            <div class="db-header-row">
                <select id="dbSelect" class="db-select" title="Выбрать базу данных"></select>
                <button class="btn-small" id="btnCreateDb" title="Создать новую базу">+ Создать</button>
            </div>
            <div class="db-header-row">
                <button class="btn-small" id="btnRenameDb" style="flex:1;">Переименовать</button>
                <button class="btn-small danger" id="btnDeleteDb" style="flex:1;">Удалить базу</button>
            </div>
        </div>

        <div class="search-container">
            <input type="text" id="searchBox" class="search-input" placeholder="🔍 Глубокий умный поиск по тексту..." autofocus>
        </div>
        
        <div id="questionsList" class="questions-list"></div>

        <div class="add-form-container">
            <div class="form-group">
                <input type="text" id="newTitle" class="form-input" placeholder="Заголовок / вопрос...">
            </div>
            <div class="form-group">
                <textarea id="newText" class="form-textarea" placeholder="Текст ответа..."></textarea>
            </div>
            <button id="btnAdd" class="btn-add">+ Добавить вопрос в эту базу</button>
            
            <div class="db-file-actions">
                <button class="btn-file-action" id="btnExport" title="Сохранить базу для папки baza">💾 Скачать в /baza</button>
                <button class="btn-file-action" id="btnImportTrigger" title="Загрузить базы из папки baza">📂 Загрузить из /baza</button>
                <input type="file" id="importFile" accept=".json" multiple>
            </div>
        </div>
    </div>

    <div class="right-pane" id="rightPane">
        <div id="dbNameLabel" class="current-db-title">Текущая база: — (0 вопросов)</div>
        <div id="emptyState" class="empty-placeholder">База данных пуста. Загрузите файлы или добавьте вопросы.</div>
    </div>

    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <div id="modalTitle" class="modal-title">Сообщение</div>
            <div id="modalDesc" class="modal-desc">Текст...</div>
            <div id="modalInputContainer" style="display: none;">
                <input type="text" id="modalInput" class="modal-input" placeholder="Введите название...">
            </div>
            <div class="modal-buttons">
                <button id="modalBtnCancel" class="modal-btn cancel">Отмена</button>
                <button id="modalBtnConfirm" class="modal-btn confirm">OK</button>
            </div>
        </div>
    </div>

    <script>
        const searchBox = document.getElementById('searchBox');
        const questionsList = document.getElementById('questionsList');
        const rightPane = document.getElementById('rightPane');
        const dbSelect = document.getElementById('dbSelect');
        const importFileInput = document.getElementById('importFile');
        const dbNameLabel = document.getElementById('dbNameLabel');

        const modalOverlay = document.getElementById('customModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const modalInput = document.getElementById('modalInput');
        const modalInputContainer = document.getElementById('modalInputContainer');
        const modalBtnCancel = document.getElementById('modalBtnCancel');
        const modalBtnConfirm = document.getElementById('modalBtnConfirm');

        function showModal(options) {
            modalTitle.textContent = options.title || 'Сообщение';
            modalDesc.textContent = options.desc || '';
            if (options.type === 'prompt') {
                modalInputContainer.style.display = 'block';
                modalInput.value = options.defaultValue || '';
                setTimeout(() => { modalInput.focus(); modalInput.select(); }, 50);
            } else {
                modalInputContainer.style.display = 'none';
            }
            modalBtnCancel.style.display = (options.type === 'alert') ? 'none' : 'inline-block';
            modalBtnConfirm.className = 'modal-btn ' + (options.confirmClass || 'confirm');
            modalBtnConfirm.textContent = options.confirmText || 'OK';
            modalOverlay.classList.add('open');

            return new Promise((resolve) => {
                const handleConfirm = () => { cleanup(); resolve(options.type === 'prompt' ? modalInput.value : true); };
                const handleCancel = () => { cleanup(); resolve(options.type === 'prompt' ? null : false); };
                const handleKeypress = (e) => { if (e.key === 'Enter') handleConfirm(); else if (e.key === 'Escape') handleCancel(); };
                const cleanup = () => {
                    modalOverlay.classList.remove('open');
                    modalBtnConfirm.removeEventListener('click', handleConfirm);
                    modalBtnCancel.removeEventListener('click', handleCancel);
                    modalInput.removeEventListener('keydown', handleKeypress);
                };
                modalBtnConfirm.addEventListener('click', handleConfirm);
                modalBtnCancel.addEventListener('click', handleCancel);
                modalInput.addEventListener('keydown', handleKeypress);
            });
        }

        const ALL_DBS_KEY = 'spy_all_databases_registry';
        const ACTIVE_DB_KEY = 'spy_active_database_name';

        function getAllDatabases() {
            const data = localStorage.getItem(ALL_DBS_KEY);
            if (data) { try { return JSON.parse(data); } catch(e) {} }
            const emptyDefault = { "Основная база": [] };
            saveAllDatabases(emptyDefault);
            return emptyDefault;
        }

        function saveAllDatabases(dbs) { localStorage.setItem(ALL_DBS_KEY, JSON.stringify(dbs)); }
        function getActiveDbName() {
            let active = localStorage.getItem(ACTIVE_DB_KEY);
            const dbs = getAllDatabases();
            if (!active || !dbs[active]) {
                active = Object.keys(dbs)[0];
                localStorage.setItem(ACTIVE_DB_KEY, active);
            }
            return active;
        }
        function setActiveDbName(name) { localStorage.setItem(ACTIVE_DB_KEY, name); }

        function updateDbSelectUI() {
            const dbs = getAllDatabases();
            const activeName = getActiveDbName();
            dbSelect.innerHTML = '';
            Object.keys(dbs).forEach(dbName => {
                const opt = document.createElement('option');
                opt.value = dbName;
                opt.textContent = dbName;
                if (dbName === activeName) opt.selected = true;
                dbSelect.appendChild(opt);
            });
            dbNameLabel.textContent = `Активная база: ${activeName} — (Всего вопросов: ${(dbs[activeName] || []).length})`;
            renderCurrentDbCards();
        }

        function renderCurrentDbCards() {
            Array.from(rightPane.getElementsByClassName('answer-card')).forEach(c => c.remove());
            const dbs = getAllDatabases();
            const activeName = getActiveDbName();
            const cardsData = dbs[activeName] || [];

            let emptyState = document.getElementById('emptyState');
            if (cardsData.length === 0) {
                if (!emptyState) {
                    const placeholder = document.createElement('div');
                    placeholder.id = 'emptyState';
                    placeholder.className = 'empty-placeholder';
                    placeholder.textContent = 'База данных пуста. Загрузите файлы или добавьте вопросы.';
                    rightPane.appendChild(placeholder);
                }
            } else {
                if (emptyState) emptyState.remove();
                cardsData.forEach((item, index) => {
                    const newCard = document.createElement('div');
                    newCard.className = 'answer-card';
                    newCard.setAttribute('data-id', item.id);
                    newCard.innerHTML = `
                        <button class="btn-delete" onclick="deleteCard('${item.id}')">Удалить</button>
                        <div class="answer-header-row"><span class="answer-number">№ ${index + 1} из ${cardsData.length}</span></div>
                        <div class="answer-title">${escapeHtml(item.title)}</div>
                        <div class="answer-text">${escapeHtml(item.text)}</div>
                    `;
                    rightPane.appendChild(newCard);
                });
            }
            initList();
        }

        function initList() {
            questionsList.innerHTML = '';
            const cards = Array.from(rightPane.getElementsByClassName('answer-card'));
            cards.forEach(card => {
                const cardId = card.getAttribute('data-id');
                const titleText = card.querySelector('.answer-title').textContent;
                const bodyText = card.querySelector('.answer-text').textContent;
                
                const item = document.createElement('div');
                item.className = 'question-item';
                item.setAttribute('data-id', cardId);
                item.setAttribute('data-search', (titleText + " " + bodyText).toLowerCase());
                item.innerHTML = `<div class="q-title">${titleText}</div>`;

                item.addEventListener('click', () => {
                    document.querySelectorAll('.question-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    cards.forEach(c => c.classList.remove('highlight'));
                    card.classList.add('highlight');
                    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                questionsList.appendChild(item);
            });
            applySmartSearch();
        }

        function applySmartSearch() {
            const rawQuery = searchBox.value.trim().toLowerCase();
            Array.from(questionsList.getElementsByClassName('question-item')).forEach(item => {
                const searchContent = item.getAttribute('data-search');
                if (rawQuery === '') {
                    item.style.display = 'none';
                } else {
                    item.style.display = rawQuery.split(/\s+/).every(term => searchContent.includes(term)) ? 'block' : 'none';
                }
            });
        }

        searchBox.addEventListener('input', applySmartSearch);
        dbSelect.addEventListener('change', (e) => { setActiveDbName(e.target.value); updateDbSelectUI(); searchBox.value = ''; });

        document.getElementById('btnCreateDb').addEventListener('click', async () => {
            const dbName = await showModal({ title: 'Создание новой базы', desc: 'Введите название:', type: 'prompt', defaultValue: 'Новая база', confirmText: 'Создать' });
            if (!dbName || !dbName.trim()) return;
            const trimmedName = dbName.trim();
            const dbs = getAllDatabases();
            if (dbs[trimmedName]) { await showModal({ title: 'Ошибка', desc: 'База уже существует!', type: 'alert' }); return; }
            dbs[trimmedName] = [];
            saveAllDatabases(dbs);
            setActiveDbName(trimmedName);
            updateDbSelectUI();
        });

        document.getElementById('btnRenameDb').addEventListener('click', async () => {
            const currentName = getActiveDbName();
            const newName = await showModal({ title: 'Переименование', desc: 'Новое имя:', type: 'prompt', defaultValue: currentName });
            if (!newName || !newName.trim() || newName.trim() === currentName) return;
            const trimmedName = newName.trim();
            const dbs = getAllDatabases();
            if (dbs[trimmedName]) { await showModal({ title: 'Ошибка', desc: 'Уже есть такая база!', type: 'alert' }); return; }
            dbs[trimmedName] = dbs[currentName];
            delete dbs[currentName];
            saveAllDatabases(dbs);
            setActiveDbName(trimmedName);
            updateDbSelectUI();
        });

        document.getElementById('btnDeleteDb').addEventListener('click', async () => {
            const currentName = getActiveDbName();
            const dbs = getAllDatabases();
            if (Object.keys(dbs).length <= 1) { await showModal({ title: 'Внимание', desc: 'Нельзя удалить последнюю базу!', type: 'alert' }); return; }
            if (await showModal({ title: 'Удаление', desc: `Удалить базу «${currentName}»?`, type: 'confirm', confirmText: 'Удалить', confirmClass: 'danger' })) {
                delete dbs[currentName];
                saveAllDatabases(dbs);
                setActiveDbName(Object.keys(dbs)[0]);
                updateDbSelectUI();
            }
        });

        document.getElementById('btnAdd').addEventListener('click', async () => {
            const titleInput = document.getElementById('newTitle');
            const textInput = document.getElementById('newText');
            const title = titleInput.value.trim();
            const text = textInput.value.trim();
            if (!title || !text) { await showModal({ title: 'Внимание', desc: 'Заполните поля!', type: 'alert' }); return; }

            const activeName = getActiveDbName();
            const dbs = getAllDatabases();
            dbs[activeName].push({ id: Date.now().toString(), title, text });
            saveAllDatabases(dbs);
            titleInput.value = ''; textInput.value = '';
            updateDbSelectUI();
            searchBox.focus();
        });

        window.deleteCard = async function(id) {
            if (await showModal({ title: 'Удаление', desc: 'Удалить этот вопрос?', type: 'confirm', confirmText: 'Удалить', confirmClass: 'danger' })) {
                const activeName = getActiveDbName();
                const dbs = getAllDatabases();
                dbs[activeName] = dbs[activeName].filter(item => item.id !== id);
                saveAllDatabases(dbs);
                updateDbSelectUI();
            }
        };

        document.getElementById('btnExport').addEventListener('click', async () => {
            const activeName = getActiveDbName();
            const cardsData = getAllDatabases()[activeName] || [];
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ dbName: activeName, data: cardsData }, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = `${activeName}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            
            await showModal({ 
                title: 'Сохранено!', 
                desc: `Файл «${activeName}.json» скачан. Перенесите его в локальную папку «baza» на вашем компьютере, чтобы отправить изменения на GitHub.`, 
                type: 'alert' 
            });
        });

        document.getElementById('btnImportTrigger').addEventListener('click', () => importFileInput.click());

        importFileInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (!files.length) return;
            const dbs = getAllDatabases();
            let count = 0;
            for (let file of files) {
                await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        try {
                            const parsed = JSON.parse(evt.target.result);
                            let dbName = file.name.replace(/\.[^/.]+$/, "");
                            let data = [];
                            if (Array.isArray(parsed)) data = parsed;
                            else if (parsed && Array.isArray(parsed.data)) {
                                dbName = parsed.dbName || dbName;
                                data = parsed.data;
                            }
                            dbs[dbName] = data;
                            setActiveDbName(dbName);
                            count++;
                        } catch(err) {}
                        resolve();
                    };
                    reader.readAsText(file);
                });
            }
            saveAllDatabases(dbs);
            updateDbSelectUI();
            importFileInput.value = '';
            await showModal({ title: 'Готово', desc: `Успешно загружено баз: ${count}`, type: 'alert' });
        });

        function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
        updateDbSelectUI();
    </script>
</body>
</html>
